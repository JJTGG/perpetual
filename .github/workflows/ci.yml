name: CI
# Gate for every human change. If a broken commit lands on main anyway,
# the self-heal job deterministically reverts it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx vitest run tests/integration --reporter=default --reporter=json --outputFile=test-report.json
      - run: npx next build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: test-report.json
          if-no-files-found: ignore

  self-heal:
    needs: verify
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Revert the breaking commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "perpetual-bot"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit "$GITHUB_SHA"
          git commit --amend -m "self-heal: revert ${GITHUB_SHA::7} (failed CI) [deploy]"
          printf '\n## %s · self-heal\n- CI failed on %s; reverted automatically\n' "$(date -u +%FT%TZ)" "${GITHUB_SHA::7}" >> changelog.md
          git commit -qam "changelog: self-heal revert of ${GITHUB_SHA::7} [deploy]"
          git pull --rebase origin main && git push origin HEAD:main
          gh issue create --title "Self-heal: reverted ${GITHUB_SHA::7}" --body "CI failed on ${GITHUB_SHA} and the commit was reverted automatically. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
